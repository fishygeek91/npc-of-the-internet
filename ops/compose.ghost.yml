# Ghost v0.1 — Docker Compose stack for a single VPS.
# Images also built and pushed by `.github/workflows/release.yml` on version tags.
#
# Optional secret-file mounts (set in ops/.env, then add exactly one overlay):
#   ops/compose.secrets.yml (production, openai-compat; NPC_COMPOSE_SECRETS=1):
#     NPC_BRAIN_API_KEY_HOST_PATH → /run/secrets/brain_api_key (runtime, and both Doors'
#       memory witness)
#     DISCORD_BOT_TOKEN_HOST_PATH → /run/secrets/discord_bot_token (door-discord)
#   ops/compose.secrets.anthropic.yml (Anthropic provider; NPC_COMPOSE_SECRETS=anthropic):
#     ANTHROPIC_API_KEY_HOST_PATH → /run/secrets/anthropic_api_key (runtime)
#     DISCORD_BOT_TOKEN_HOST_PATH → /run/secrets/discord_bot_token (door-discord)
# When using files, set ANTHROPIC_API_KEY_FILE=/run/secrets/anthropic_api_key and/or
# NPC_BRAIN_API_KEY_FILE=/run/secrets/brain_api_key and/or
# DISCORD_BOT_TOKEN_FILE=/run/secrets/discord_bot_token (exactly one of NAME or NAME_FILE).

name: npc-ghost

services:
  runtime:
    build:
      context: ..
      dockerfile: ops/Dockerfile.runtime
    image: ghcr.io/fishygeek91/npc-runtime:${NPC_IMAGE_TAG:-latest}
    restart: unless-stopped
    # Stable hostname: osp-core's append lock records host + process start time,
    # so a recreated container (new id) still recognises its predecessor's lock
    # as stale instead of waiting out LOCK_MAX_AGE_MS.
    hostname: ghost-runtime
    # Docker's tini as PID 1: forwards SIGTERM/SIGINT and reaps zombie children.
    init: true
    depends_on:
      door-discord:
        condition: service_healthy
    environment:
      SOUL_KEY_PATH: /run/keys/soul.key
      SOULCHAIN_DIR: /data/soulchain
      NPC_SOULCHAIN_IPFS_DIR: /data/soulchain-ipfs
      NPC_PUBLISHED_CAR_PATH: /data/published/soulchain-latest.car
      NPC_MANIFEST_CID_PATH: /data/published/manifest-cid.txt
      # Every Door the Wanderer may travel between (it lives in one at a time).
      NPC_DOOR_URLS: ${NPC_DOOR_URLS:-http://door-discord:9090,http://door-web:9091}
      # Boot preference only (the Door of its last arrival wins when reachable).
      CURRENT_DOOR_ID: discord:${DISCORD_GUILD_ID}
      ATLAS_DOOR_PUBKEYS: ${ATLAS_DOOR_PUBKEYS:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_API_KEY_FILE: ${ANTHROPIC_API_KEY_FILE:-}
      NPC_BRAIN_PROVIDER: ${NPC_BRAIN_PROVIDER:-}
      NPC_BRAIN_BASE_URL: ${NPC_BRAIN_BASE_URL:-}
      NPC_BRAIN_API_KEY: ${NPC_BRAIN_API_KEY:-}
      NPC_BRAIN_API_KEY_FILE: ${NPC_BRAIN_API_KEY_FILE:-}
      NPC_BRAIN_PROVIDER_ALLOWLIST: ${NPC_BRAIN_PROVIDER_ALLOWLIST:-}
      NPC_BRAIN_MODEL: ${NPC_BRAIN_MODEL:-}
      NPC_BRAIN_MAX_TOKENS: ${NPC_BRAIN_MAX_TOKENS:-1024}
      NPC_BRAIN_TIMEOUT_MS: ${NPC_BRAIN_TIMEOUT_MS:-60000}
      NPC_ATTENTION_MODE: ${NPC_ATTENTION_MODE:-selective}
      # Residency lifecycle (reside → witnessed memories → travel), ops/RUNBOOK.md §7.
      # Moves on about once a day (0 = only when an operator triggers it); a stay with
      # fewer than NPC_RESIDENCY_MIN_LINES lines still travels but forms no memories.
      NPC_RESIDENCY_OPERATOR_TRIGGER: ${NPC_RESIDENCY_OPERATOR_TRIGGER:-1}
      NPC_RESIDENCY_MAX_MS: ${NPC_RESIDENCY_MAX_MS:-86400000}
      NPC_RESIDENCY_MIN_LINES: ${NPC_RESIDENCY_MIN_LINES:-10}
      # Fixed paths: control requests live on the /tmp tmpfs (cleared on restart, so a
      # stale request never fires later); journals go to the shared `published` volume.
      NPC_CONTROL_DIR: /tmp/npc-control
      NPC_JOURNAL_DIR: /data/published/journals
    volumes:
      - soulchain:/data/soulchain
      - soulchain-ipfs:/data/soulchain-ipfs
      - published:/data/published
      - ${SOUL_KEY_HOST_PATH}:/run/keys/soul.key:ro
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/npc-runtime.ready"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 90s
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    read_only: true
    tmpfs:
      - /tmp

  door-discord:
    build:
      context: ..
      dockerfile: ops/Dockerfile.door-discord
    image: ghcr.io/fishygeek91/npc-door-discord:${NPC_IMAGE_TAG:-latest}
    restart: unless-stopped
    # Docker's tini as PID 1: forwards SIGTERM/SIGINT and reaps zombie children.
    init: true
    environment:
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_BOT_TOKEN_FILE: ${DISCORD_BOT_TOKEN_FILE:-}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID}
      DISCORD_CHANNEL_ID: ${DISCORD_CHANNEL_ID}
      DISCORD_OPERATOR_IDS: ${DISCORD_OPERATOR_IDS}
      DISCORD_PRESENCE_NOTICES: ${DISCORD_PRESENCE_NOTICES:-1}
      DISCORD_USER_RATE_PER_MIN: ${DISCORD_USER_RATE_PER_MIN:-20}
      DISCORD_USER_BURST: ${DISCORD_USER_BURST:-5}
      DISCORD_CHANNEL_RATE_PER_MIN: ${DISCORD_CHANNEL_RATE_PER_MIN:-60}
      DISCORD_CHANNEL_BURST: ${DISCORD_CHANNEL_BURST:-15}
      DISCORD_COMMUNITY_NAME: ${DISCORD_COMMUNITY_NAME:-Discord Door}
      DISCORD_COMMUNITY_DESCRIPTION: ${DISCORD_COMMUNITY_DESCRIPTION:-A Discord channel hosting the Wanderer.}
      DOOR_KEY_PATH: /run/keys/door.key
      SOUL_PUBLIC_KEY: ${SOUL_PUBLIC_KEY}
      DOOR_HTTP_HOST: "0.0.0.0"
      DOOR_HTTP_PORT: "9090"
      # Memory witness (spec/door/api.md §Memory witnessing): an independent model call that
      # checks each memory against what this Door saw. Defaults to the Brain's provider,
      # key and model; override with DOOR_WITNESS_* or turn off with DOOR_WITNESS=off.
      NPC_BRAIN_PROVIDER: ${NPC_BRAIN_PROVIDER:-}
      NPC_BRAIN_BASE_URL: ${NPC_BRAIN_BASE_URL:-}
      NPC_BRAIN_API_KEY: ${NPC_BRAIN_API_KEY:-}
      NPC_BRAIN_API_KEY_FILE: ${NPC_BRAIN_API_KEY_FILE:-}
      NPC_BRAIN_PROVIDER_ALLOWLIST: ${NPC_BRAIN_PROVIDER_ALLOWLIST:-}
      NPC_BRAIN_MODEL: ${NPC_BRAIN_MODEL:-}
      DOOR_WITNESS: ${DOOR_WITNESS:-}
      DOOR_WITNESS_BASE_URL: ${DOOR_WITNESS_BASE_URL:-}
      DOOR_WITNESS_API_KEY: ${DOOR_WITNESS_API_KEY:-}
      DOOR_WITNESS_API_KEY_FILE: ${DOOR_WITNESS_API_KEY_FILE:-}
      DOOR_WITNESS_MODEL: ${DOOR_WITNESS_MODEL:-}
      DOOR_WITNESS_PROVIDER_ALLOWLIST: ${DOOR_WITNESS_PROVIDER_ALLOWLIST:-}
      DOOR_WITNESS_TIMEOUT_MS: ${DOOR_WITNESS_TIMEOUT_MS:-}
    volumes:
      - ${DOOR_KEY_HOST_PATH}:/run/keys/door.key:ro
    expose:
      - "9090"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:9090/').then(()=>process.exit(0)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    read_only: true
    tmpfs:
      - /tmp

  door-web:
    build:
      context: ..
      dockerfile: ops/Dockerfile.door-web
    image: ghcr.io/fishygeek91/npc-door-web:${NPC_IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    environment:
      DOOR_WEB_ID: ${DOOR_WEB_ID:-web:home}
      DOOR_WEB_COMMUNITY_NAME: ${DOOR_WEB_COMMUNITY_NAME:-The Wanderer's front porch}
      DOOR_WEB_COMMUNITY_DESCRIPTION: ${DOOR_WEB_COMMUNITY_DESCRIPTION:-A public web room where anyone can talk with the Wanderer while it is here.}
      # Same Door key as door-discord: one host, two Doors (add web:home=<door pubkey> to
      # ATLAS_DOOR_PUBKEYS).
      DOOR_KEY_PATH: /run/keys/door.key
      SOUL_PUBLIC_KEY: ${SOUL_PUBLIC_KEY}
      # Door protocol for the runtime (internal network only).
      DOOR_HTTP_HOST: "0.0.0.0"
      DOOR_HTTP_PORT: "9091"
      # Visitor site. Published on 127.0.0.1 only; the `public` profile puts Caddy (TLS) in
      # front, which is why the last X-Forwarded-For hop is trusted.
      DOOR_WEB_PUBLIC_HOST: "0.0.0.0"
      DOOR_WEB_PUBLIC_PORT: "8080"
      DOOR_WEB_TRUST_PROXY: ${DOOR_WEB_TRUST_PROXY:-1}
      DOOR_WEB_GLOBAL_PER_MIN: ${DOOR_WEB_GLOBAL_PER_MIN:-30}
      DOOR_WEB_MAX_CLIENTS: ${DOOR_WEB_MAX_CLIENTS:-200}
      ATLAS_API_URL: http://atlas-api:8787
      # Memory witness (spec/door/api.md §Memory witnessing): an independent model call that
      # checks each memory against what this Door saw. Defaults to the Brain's provider,
      # key and model; override with DOOR_WITNESS_* or turn off with DOOR_WITNESS=off.
      NPC_BRAIN_PROVIDER: ${NPC_BRAIN_PROVIDER:-}
      NPC_BRAIN_BASE_URL: ${NPC_BRAIN_BASE_URL:-}
      NPC_BRAIN_API_KEY: ${NPC_BRAIN_API_KEY:-}
      NPC_BRAIN_API_KEY_FILE: ${NPC_BRAIN_API_KEY_FILE:-}
      NPC_BRAIN_PROVIDER_ALLOWLIST: ${NPC_BRAIN_PROVIDER_ALLOWLIST:-}
      NPC_BRAIN_MODEL: ${NPC_BRAIN_MODEL:-}
      DOOR_WITNESS: ${DOOR_WITNESS:-}
      DOOR_WITNESS_BASE_URL: ${DOOR_WITNESS_BASE_URL:-}
      DOOR_WITNESS_API_KEY: ${DOOR_WITNESS_API_KEY:-}
      DOOR_WITNESS_API_KEY_FILE: ${DOOR_WITNESS_API_KEY_FILE:-}
      DOOR_WITNESS_MODEL: ${DOOR_WITNESS_MODEL:-}
      DOOR_WITNESS_PROVIDER_ALLOWLIST: ${DOOR_WITNESS_PROVIDER_ALLOWLIST:-}
      DOOR_WITNESS_TIMEOUT_MS: ${DOOR_WITNESS_TIMEOUT_MS:-}
    volumes:
      - ${DOOR_KEY_HOST_PATH}:/run/keys/door.key:ro
    expose:
      - "9091"
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    read_only: true
    tmpfs:
      - /tmp
  # Public HTTPS for the web Door: `ghostc --profile public up -d` (needs WEB_DOMAIN in
  # ops/.env, a DNS A/AAAA record for it, and ports 80/443 open). Caddy gets and renews
  # the certificate itself.
  caddy:
    image: caddy:2.10-alpine
    profiles: ["public"]
    restart: unless-stopped
    depends_on:
      - door-web
    environment:
      # Set WEB_DOMAIN in ops/.env (unset = Caddy serves only "localhost").
      WEB_DOMAIN: ${WEB_DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # The only internet-facing container: same lockdown as the rest (#72), plus the one
    # capability needed to bind 80/443.
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - "no-new-privileges:true"
    read_only: true
    tmpfs:
      - /tmp
  atlas-api:
    build:
      context: ..
      dockerfile: ops/Dockerfile.atlas-api
    image: ghcr.io/fishygeek91/npc-atlas-api:${NPC_IMAGE_TAG:-latest}
    restart: unless-stopped
    # Docker's tini as PID 1: forwards SIGTERM/SIGINT and reaps zombie children.
    init: true
    # Docker published ports bypass ufw — always bind 127.0.0.1 unless Gate-2-approved.
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      ATLAS_CHAIN_DIR: /data/soulchain
      ATLAS_PORT: "8787"
      ATLAS_DOOR_PUBKEYS: ${ATLAS_DOOR_PUBKEYS:-}
      NPC_PUBLISHED_CAR_PATH: /data/published/soulchain-latest.car
      NPC_MANIFEST_CID_PATH: /data/published/manifest-cid.txt
    volumes:
      - soulchain:/data/soulchain:ro
      - published:/data/published:ro
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8787/state').then(()=>process.exit(0)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    read_only: true
    tmpfs:
      - /tmp

  backup:
    build:
      context: ..
      dockerfile: ops/Dockerfile.backup
    image: ghcr.io/fishygeek91/npc-backup:${NPC_IMAGE_TAG:-latest}
    restart: unless-stopped
    # Docker's tini as PID 1: forwards SIGTERM/SIGINT and reaps zombie children.
    init: true
    depends_on:
      runtime:
        condition: service_started
    environment:
      BACKUP_SOURCE_DIR: /data/soulchain
      BACKUP_RCLONE_REMOTE: ${BACKUP_RCLONE_REMOTE}
      RCLONE_CONFIG: /config/rclone/rclone.conf
      RCLONE_CACHE_DIR: /tmp/rclone-cache
      BACKUP_OK_PATH: /tmp/backup.ok
      BACKUP_DEBOUNCE_SEC: ${BACKUP_DEBOUNCE_SEC:-30}
      BACKUP_INTERVAL_SEC: ${BACKUP_INTERVAL_SEC:-300}
      BACKUP_VERIFY_SEC: ${BACKUP_VERIFY_SEC:-86400}
      BACKUP_RETRY_SEC: ${BACKUP_RETRY_SEC:-900}
      BACKUP_HEARTBEAT_DEFER_SEC: ${BACKUP_HEARTBEAT_DEFER_SEC:-3600}
      BACKUP_HISTORY_SEC: ${BACKUP_HISTORY_SEC:-86400}
    volumes:
      - soulchain:/data/soulchain:ro
      - ${RCLONE_CONFIG_HOST_PATH}:/config/rclone:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test -f /tmp/backup.ok && test $$(($$(date +%s) - $$(stat -c %Y /tmp/backup.ok 2>/dev/null || stat -f %m /tmp/backup.ok))) -lt 900"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    read_only: true
    tmpfs:
      - /tmp

volumes:
  soulchain:
  soulchain-ipfs:
  published:
  caddy-data:
  caddy-config:

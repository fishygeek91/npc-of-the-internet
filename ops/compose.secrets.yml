# Optional overlay for file-based API/bot secrets (#72).
# Requires host paths in ops/.env:
#   ANTHROPIC_API_KEY_HOST_PATH and/or NPC_BRAIN_API_KEY_HOST_PATH, DISCORD_BOT_TOKEN_HOST_PATH
# And in-container FILE vars (comment out the direct env secrets):
#   ANTHROPIC_API_KEY_FILE=/run/secrets/anthropic_api_key
#   NPC_BRAIN_API_KEY_FILE=/run/secrets/brain_api_key
#   DISCORD_BOT_TOKEN_FILE=/run/secrets/discord_bot_token
#
# Usage:
#   docker compose --env-file ops/.env -f ops/compose.ghost.yml -f ops/compose.secrets.yml up -d
# Or: NPC_COMPOSE_SECRETS=1 bash ops/scripts/ghostc.sh up -d

services:
  runtime:
    volumes:
      - ${ANTHROPIC_API_KEY_HOST_PATH}:/run/secrets/anthropic_api_key:ro
      # When using openai-compat file secrets, also set NPC_BRAIN_API_KEY_HOST_PATH
      # and uncomment:
      # - ${NPC_BRAIN_API_KEY_HOST_PATH}:/run/secrets/brain_api_key:ro
  door-discord:
    volumes:
      - ${DISCORD_BOT_TOKEN_HOST_PATH}:/run/secrets/discord_bot_token:ro

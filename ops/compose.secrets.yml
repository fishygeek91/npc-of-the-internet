# Optional overlay for file-based secrets (#72) — PRODUCTION provider (openai-compat,
# e.g. OpenRouter). For NPC_BRAIN_PROVIDER=anthropic use compose.secrets.anthropic.yml
# instead (use exactly one secrets overlay).
#
# Requires host paths in ops/.env (missing/empty → compose fails with a clear error
# instead of rendering an invalid ":/run/secrets/..." volume spec):
#   NPC_BRAIN_API_KEY_HOST_PATH, DISCORD_BOT_TOKEN_HOST_PATH
# And the in-container FILE vars (comment out the direct env secrets — exactly one of
# NAME or NAME_FILE):
#   NPC_BRAIN_API_KEY_FILE=/run/secrets/brain_api_key
#   DISCORD_BOT_TOKEN_FILE=/run/secrets/discord_bot_token
#
# Usage:
#   docker compose --env-file ops/.env -f ops/compose.ghost.yml -f ops/compose.secrets.yml up -d
# Or: NPC_COMPOSE_SECRETS=1 bash ops/scripts/ghostc.sh up -d

services:
  runtime:
    volumes:
      - ${NPC_BRAIN_API_KEY_HOST_PATH:?set NPC_BRAIN_API_KEY_HOST_PATH in ops/.env (ops/SECRETS.md)}:/run/secrets/brain_api_key:ro
  door-discord:
    volumes:
      - ${DISCORD_BOT_TOKEN_HOST_PATH:?set DISCORD_BOT_TOKEN_HOST_PATH in ops/.env (ops/SECRETS.md)}:/run/secrets/discord_bot_token:ro
      # Memory witness reuses the Brain key (NPC_BRAIN_API_KEY_FILE) unless DOOR_WITNESS_* is set.
      - ${NPC_BRAIN_API_KEY_HOST_PATH:?set NPC_BRAIN_API_KEY_HOST_PATH in ops/.env (ops/SECRETS.md)}:/run/secrets/brain_api_key:ro
  door-web:
    volumes:
      - ${NPC_BRAIN_API_KEY_HOST_PATH:?set NPC_BRAIN_API_KEY_HOST_PATH in ops/.env (ops/SECRETS.md)}:/run/secrets/brain_api_key:ro

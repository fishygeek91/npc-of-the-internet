# Optional overlay for file-based secrets (#72) — Anthropic provider
# (NPC_BRAIN_PROVIDER=anthropic or unset). Production uses openai-compat:
# use compose.secrets.yml there instead (use exactly one secrets overlay).
#
# Requires host paths in ops/.env (missing/empty → compose fails with a clear error
# instead of rendering an invalid ":/run/secrets/..." volume spec):
#   ANTHROPIC_API_KEY_HOST_PATH, DISCORD_BOT_TOKEN_HOST_PATH
# And the in-container FILE vars (comment out the direct env secrets — exactly one of
# NAME or NAME_FILE):
#   ANTHROPIC_API_KEY_FILE=/run/secrets/anthropic_api_key
#   DISCORD_BOT_TOKEN_FILE=/run/secrets/discord_bot_token
#
# Usage:
#   docker compose --env-file ops/.env -f ops/compose.ghost.yml -f ops/compose.secrets.anthropic.yml up -d
# Or: NPC_COMPOSE_SECRETS=anthropic bash ops/scripts/ghostc.sh up -d

services:
  runtime:
    volumes:
      - ${ANTHROPIC_API_KEY_HOST_PATH:?set ANTHROPIC_API_KEY_HOST_PATH in ops/.env (ops/SECRETS.md)}:/run/secrets/anthropic_api_key:ro
  door-discord:
    volumes:
      - ${DISCORD_BOT_TOKEN_HOST_PATH:?set DISCORD_BOT_TOKEN_HOST_PATH in ops/.env (ops/SECRETS.md)}:/run/secrets/discord_bot_token:ro

# Build the Atlas static site from the T5.1 fixture chain and publish to GitHub Pages.
# Requires: Settings → Pages → Source = GitHub Actions.
# Soft-fails the deploy step when Pages is not yet enabled so main stays green.
# After enabling Pages, set repo variable PAGES_ENABLED=true so deploy failures are hard.
name: Deploy Atlas Site

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: build only reads the repo; Pages/OIDC write is scoped to the deploy job.
permissions:
  contents: read

concurrency:
  group: deploy-atlas-site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build workspace dependencies
        run: pnpm --filter @npc/osp-core --filter @npc/atlas build
      - name: Build Atlas site from fixture chain
        working-directory: packages/atlas-site
        env:
          ATLAS_SITE_CHAIN_DIR: ${{ github.workspace }}/packages/atlas/test/fixtures/multi-residency
          ATLAS_SITE_BASE: /npc-of-the-internet/
        run: pnpm build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: packages/atlas-site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    continue-on-error: ${{ vars.PAGES_ENABLED != 'true' }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

# Build the Atlas static site from the T5.1 fixture chain and publish to GitHub Pages.
# Requires: Settings → Pages → Source = GitHub Actions.
# Soft-fails the deploy step when Pages is not yet enabled so main stays green.
# After enabling Pages, set repo variable PAGES_ENABLED=true so deploy failures are hard.
name: Deploy Atlas Site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-atlas-site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build workspace dependencies
        run: pnpm --filter @npc/osp-core --filter @npc/atlas build
      - name: Build Atlas site from fixture chain
        working-directory: packages/atlas-site
        env:
          ATLAS_SITE_CHAIN_DIR: ${{ github.workspace }}/packages/atlas/test/fixtures/multi-residency
          ATLAS_SITE_BASE: /npc-of-the-internet/
        run: pnpm build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: packages/atlas-site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    continue-on-error: ${{ vars.PAGES_ENABLED != 'true' }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

# Monthly offline restore drill (T7.13).
# Same fixture drill as CI. No production remote, no VPS, no repository secrets.
# A failed run opens or comments on a GitHub issue with the workflow token.
name: Ops drill

on:
  schedule:
    # 16:00 UTC on the 1st of each month.
    - cron: "0 16 1 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ops-drill
  cancel-in-progress: false

jobs:
  drill:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install rclone
        run: sudo apt-get update && sudo apt-get install -y rclone
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @npc/osp-cli... build
      - name: Run offline restore drill
        run: bash ops/scripts/restore-drill.sh

  report-failure:
    needs: drill
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update a drill-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title="[ops] offline restore drill failed"
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          body=$(cat <<EOF
          The offline restore drill failed.

          Run: ${run_url}

          Consult ops/RUNBOOK.md section 5.1 and ops/AI-OPERATOR.md.
          This workflow does not contact production and has no deploy credentials.
          A human still approves every Gate 2 action.
          EOF
          )
          number="$(gh issue list --state open --limit 50 --json number,title --jq '[.[] | select(.title == "[ops] offline restore drill failed") | .number] | first // empty')"
          if [[ -z "${number}" ]]; then
            gh issue create --title "${title}" --body "${body}"
          else
            gh issue comment "${number}" --body "${body}"
          fi

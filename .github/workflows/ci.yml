name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm test

  audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate Ghost compose file
        run: |
          # #64: every published port must bind 127.0.0.1 (Docker bypasses ufw).
          # #72: mem limits, logging rotation, lockdown, healthchecks, depends_on healthy.
          docker compose --env-file ops/.env.example -f ops/compose.ghost.yml config --format json \
            | python3 -c '
          import json, sys
          cfg = json.load(sys.stdin)
          services = cfg.get("services") or {}
          expected_mem = {
              "runtime": 1073741824,
              "door-discord": 536870912,
              "atlas-api": 536870912,
              "backup": 268435456,
          }
          for name, want in expected_mem.items():
              svc = services.get(name)
              if svc is None:
                  raise SystemExit(f"missing service {name}")
              got = svc.get("mem_limit")
              try:
                  got_n = int(got)
              except (TypeError, ValueError) as exc:
                  raise SystemExit(f"{name} mem_limit: expected {want}, got {got!r}") from exc
              if got_n != want:
                  raise SystemExit(f"{name} mem_limit: expected {want}, got {got!r}")
              logging = svc.get("logging") or {}
              opts = logging.get("options") or {}
              if logging.get("driver") != "json-file":
                  raise SystemExit(f"{name} logging.driver must be json-file")
              if opts.get("max-size") != "10m" or str(opts.get("max-file")) not in ("3", 3):
                  raise SystemExit(f"{name} logging options must be max-size=10m max-file=3")
              if "ALL" not in (svc.get("cap_drop") or []):
                  raise SystemExit(f"{name} must cap_drop ALL")
              if "no-new-privileges:true" not in (svc.get("security_opt") or []):
                  raise SystemExit(f"{name} must set no-new-privileges:true")
              if svc.get("read_only") is not True:
                  raise SystemExit(f"{name} must be read_only")
              tmpfs = svc.get("tmpfs") or []
              # compose may render tmpfs as list of strings or dict
              tmpfs_ok = False
              if isinstance(tmpfs, dict):
                  tmpfs_ok = "/tmp" in tmpfs
              else:
                  tmpfs_ok = any(
                      (isinstance(t, str) and t.startswith("/tmp"))
                      or (isinstance(t, dict) and "/tmp" in t)
                      for t in tmpfs
                  )
              if not tmpfs_ok:
                  raise SystemExit(f"{name} must mount tmpfs /tmp, got {tmpfs!r}")
              if not (svc.get("healthcheck") or {}).get("test"):
                  raise SystemExit(f"{name} must define a healthcheck")

          runtime_deps = (services.get("runtime") or {}).get("depends_on") or {}
          door_dep = runtime_deps.get("door-discord")
          if not isinstance(door_dep, dict) or door_dep.get("condition") != "service_healthy":
              raise SystemExit(
                  f"runtime must depends_on door-discord with condition service_healthy, got {door_dep!r}"
              )

          ports = [
              (name, p)
              for name, svc in services.items()
              for p in (svc.get("ports") or [])
          ]
          if not ports:
              raise SystemExit("expected at least one published port (atlas-api)")
          bad = [(n, p) for n, p in ports if p.get("host_ip") != "127.0.0.1"]
          if bad:
              raise SystemExit(f"published ports must bind 127.0.0.1: {bad}")
          atlas = [p for n, p in ports if n == "atlas-api"]
          if not any(str(p.get("published")) == "8787" for p in atlas):
              raise SystemExit("atlas-api must publish 8787 on 127.0.0.1")
          print("compose-config: hardening + localhost bind OK")
          '

  image-cmd-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Ghost image CMD smoke (#62)
        run: bash ops/scripts/image-cmd-smoke.sh

  restore-drill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install rclone
        run: sudo apt-get update && sudo apt-get install -y rclone
      - run: pnpm install --frozen-lockfile
      # Build osp-cli and its workspace deps (osp-core) so tsc can resolve @npc/osp-core.
      - run: pnpm --filter @npc/osp-cli... build
      - name: Run offline restore drill
        run: bash ops/scripts/restore-drill.sh

  key-backup-drill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install age + rclone
        run: sudo apt-get update && sudo apt-get install -y age rclone
      - name: Run offline key-backup drill (#72)
        run: bash ops/scripts/key-backup-drill.sh

  launch-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install rclone
        run: sudo apt-get update && sudo apt-get install -y rclone
      - run: pnpm install --frozen-lockfile
      - name: Run offline launch dry-run
        run: bash ops/scripts/launch-dry-run.sh

  uid-mount-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Linux bind-mount uid/gid check (#84)
        run: bash ops/scripts/uid-mount-check.sh

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Scan for secrets (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
